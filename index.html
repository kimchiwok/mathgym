  const l=state.level,ts=TOPICS.filter(x=>x.level===l);
  const unread=ts.find(x=>!state.lessons[x.id]);
  const weakest=[...ts].sort((a,b)=>(mast(a.id)??-1)-(mast(b.id)??-1))[0];
  return`${levelReady(l)?`<div class="banner">${t('banner',LN(l),l+1,LN(l+1))} <button class="btn sm" style="margin-left:8px" data-act="setLevel" data-arg="${l+1}">${t('moveUp')}</button></div>`:''}
  <div class="card hero"><div class="eyebrow">${t('lvl',l,LN(l))}</div><h1>${t('hi',esc(state.nick))}</h1><p class="muted">${state.totals.a?t('keepGoing'):t('ready')} · ${LD(l)}</p>
   <div class="bar" style="margin:10px 0 6px"><i style="width:${Math.round(levelPct(l)*100)}%"></i></div><p class="small muted">${t('levelMastery',Math.round(levelPct(l)*100))}</p>
   <div class="row" style="margin-top:6px"><button class="btn primary" data-act="practice" data-arg="mixed">${t('mixedBtn')}</button>
   ${unread?`<button class="btn" data-act="lesson" data-arg="${unread.id}">${t('nextLesson',TT(unread.id))}</button>`:`<button class="btn" data-act="practice" data-arg="${weakest.id}">${t('focusOn',TT(weakest.id))}</button>`}</div>${ageLine()}</div>
  ${statsRow()}<h2>${t('yourTopics')}</h2><div class="grid">${ts.map(topicCard).join('')}</div>`;
}
function vLearn(){
  const Ls=B().levels;const L=Ls.includes(learnLevel)?learnLevel:curLevel();
  return`<h1>${t('learn')}</h1><p class="muted">${t('learnP')}</p>
  <div class="tabs">${Ls.map(l=>`<button class="${L===l?'on':''}" data-act="learnLevel" data-arg="${l}">${l}. ${LN(l)}${state.level===l?' ★':''}</button>`).join('')}</div>
  <div class="grid">${TOPICS.filter(x=>x.level===L).map(topicCard).join('')}</div>`;
}
function vLesson(){
  const tp=T[curLesson];const sib=TOPICS.filter(x=>x.level===tp.level);const nxt=sib[sib.indexOf(tp)+1];
  return`<div class="card lesson" style="max-width:700px;margin:0 auto 16px"><div class="eyebrow">${t('lvl',tp.level,LN(tp.level))}</div><h1>${TT(tp.id)}</h1>${tp.lesson[lang]()}
  <div class="row" style="margin-top:18px"><button class="btn primary" data-act="practice" data-arg="${tp.id}">${t('practiceThis')}</button>${nxt?`<button class="btn" data-act="lesson" data-arg="${nxt.id}">${t('nextLesson',TT(nxt.id))}</button>`:''}<button class="btn ghost" data-act="go" data-arg="learn">${t('allLessons')}</button></div></div>`;
}
const ansText=q=>q.show||(fmt(q.ans)+(q.unit&&q.unit!=='$'?' '+q.unit:''));
function vQuiz(){
  const q=Q(S.items[S.i]),r=S.res[S.i],n=S.items.length,isP=S.mode==='placement';
  const fb=S.checked?`<div class="fb ${r.ok?'ok':'bad'}"><div class="h">${r.ok?t('correct'):r.skipped?t('howItWorks'):t('notQuite')}${r.ok?'':` · ${t('answer')}: ${ansText(q)}`}</div>${q.explain}</div>`:'';
  return`<div class="qwrap"><div class="qtop"><span>${esc(sessTitle(S))}${!isP&&S.topicId==='mixed'?` · ${TT(q.topic)}`:''}</span><span>${S.i+1} / ${n}</span></div>
  <div class="qbar"><i style="width:${(S.i+(S.checked?1:0))/n*100}%"></i></div>
  <div class="card"><div class="qtext">${q.q}</div>
  <form id="qform" autocomplete="off"><div class="ansrow">${q.unit==='$'?'<span class="unit">$</span>':''}<input id="ans" placeholder="${t('yourAnswer')}" ${S.checked?'readonly':''} class="${S.checked?(r.ok?'ok':'bad'):''}" value="${S.checked?esc(r.raw||''):esc(S.draft||'')}" aria-label="${t('yourAnswer')}">${q.unit&&q.unit!=='$'?`<span class="unit">${q.unit}</span>`:''}</div>
  ${q.hint?`<div class="hint">${q.hint}</div>`:''}<div class="msg" id="msg"></div>
  <div class="row">${S.checked?`<button class="btn primary" type="submit">${S.i+1<n?t('next'):t('seeResults')}</button>`:
   `<button class="btn primary" type="submit">${isP?(S.i+1<n?t('next'):t('finish')):t('check')}</button><button class="btn ghost" type="button" data-act="skip">${t('idk')}</button>`}</div></form>${fb}</div></div>`;
}
function reviewList(items,res){
  return items.map((it,i)=>{const q=Q(it);const r=res[i]||{};return`<details><summary><span class="mark ${r.ok?'ok':'bad'}">${r.ok?'✓':'✗'}</span><span>${q.q.replace(/<br>/g,' · ')} <span class="muted small">· ${TT(q.topic)}</span></span></summary>
  <div class="body"><div class="small muted">${t('revYour')}: ${r.skipped?t('skipped'):esc(r.raw||'')} · ${t('revCorrect')}: ${ansText(q)}</div><div style="margin-top:6px">${q.explain}</div></div></details>`;}).join('');
}
function vPlacementResult(){
  const pr=lastPlacement||{};const p=state.placement;const l=p.level;const lv=Object.keys(p.byLevel).map(Number).sort((a,b)=>a-b);
  const msg=p.top?t('res4',LN(l)):l===lv[0]?t('res1'):t('resMid',LN(l-1),LN(l));
  return`<div class="card hero"><div class="eyebrow">${t('resEyebrow',p.score,p.total)}</div><h1>${t('startAt',l,LN(l))}</h1><p class="muted">${LD(l)}</p><p>${msg}</p>
  <div class="row"><button class="btn primary" data-act="go" data-arg="home">${t('goDash')}</button><button class="btn" data-act="lesson" data-arg="${TOPICS.find(x=>x.level===l).id}">${t('readFirst')}</button></div></div>
  <div class="card"><h2>${t('byLevel')}</h2><table><tr><th>${t('thLevel')}</th><th></th><th class="num">${t('thScore')}</th></tr>
  ${lv.map(k=>{const [c,tt]=p.byLevel[k];return`<tr><td>${k}. ${LN(k)}</td><td style="width:40%"><div class="bar"><i style="width:${c/tt*100}%"></i></div></td><td class="num">${c}/${tt}</td></tr>`;}).join('')}</table>
  <p class="small muted" style="margin-top:10px">${t('passRule')}</p></div>
  ${pr.items?`<div class="card"><h2>${t('reviewAns')}</h2>${reviewList(pr.items,pr.res)}</div>`:''}`;
}
function vSummary(){
  const c=S.res.filter(r=>r&&r.ok).length,n=S.items.length;const xp=state.xp-S.startXp;const pct=c/n;
  return`<div class="card hero" style="text-align:center"><div class="eyebrow">${esc(t('done',sessTitle(S)))}</div><div class="big">${c}/${n}</div>
  <p class="muted" style="margin-top:8px">+${xp} XP · ${pct>=0.9?t('sum90'):pct>=0.7?t('sum70'):pct>=0.5?t('sum50'):t('sum0')}</p>
  <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" data-act="again">${t('again')}</button>${S.topicId&&S.topicId!=='mixed'?`<button class="btn" data-act="lesson" data-arg="${S.topicId}">${t('reread')}</button>`:''}<button class="btn ghost" data-act="go" data-arg="home">${t('dashboard')}</button></div></div>
  <div class="card"><h2>${t('review')}</h2>${reviewList(S.items,S.res)}</div>`;
}
function vProgress(){
  const p=state.placement;
  return`<h1>${t('progress')}</h1>${statsRow()}
  <div class="card"><h2>${t('masteryH')}</h2><p class="small muted">${t('masteryP')}</p>
  <table><tr><th>${t('thTopic')}</th><th></th><th class="num">${t('thRecent')}</th><th class="num">${t('thAll')}</th></tr>
  ${B().levels.map(l=>`<tr><td colspan="4" style="padding-top:16px"><b>${l}. ${LN(l)}</b>${state.level===l?` <span class="pill good">${t('current')}</span>`:''}</td></tr>`+TOPICS.filter(x=>x.level===l).map(x=>{const s=state.topics[x.id];const m=mast(x.id);const [lab,cls]=mastInfo(x.id);
   return`<tr><td>${TT(x.id)} <span class="pill ${cls}">${lab}</span></td><td style="width:28%"><div class="bar"><i style="width:${Math.round((m||0)*100)}%"></i></div></td><td class="num">${m===null?'–':Math.round(m*100)+'%'}</td><td class="num">${s?`${s.c}/${s.a}`:'–'}</td></tr>`;}).join('')).join('')}</table></div>
  <div class="card"><h2>${t('recent')}</h2>${state.history.length?`<table><tr><th>${t('thDate')}</th><th>${t('thSession')}</th><th class="num">${t('thScore')}</th></tr>${state.history.slice(-12).reverse().map(h=>`<tr><td class="small">${h.d}</td><td>${esc(histTitle(h))}</td><td class="num">${h.c}/${h.t}</td></tr>`).join('')}</table>`:`<p class="muted">${t('noSessions')}</p>`}</div>
  <div class="card"><h2>${t('placementH')}</h2>${p?`<p>${t('taken',p.date,p.score,p.total,p.level,LN(p.level))}</p>`:`<p class="muted">${t('notTaken')}</p>`}
  <div class="row"><button class="btn" data-act="startPlacement">${p?t('retake'):t('take')}</button>
  ${confirmReset?`<button class="btn" style="color:var(--low);border-color:var(--low)" data-act="reset">${t('resetYes')}</button><button class="btn ghost" data-act="cancelReset">${t('cancel')}</button>`:`<button class="btn ghost" data-act="askReset">${t('resetAsk')}</button>`}</div></div>`;
}

function render(){
  document.documentElement.lang=lang;
  if(needsProfile()&&view!=='register'){view='register';regMode=state?'complete':'new';}
  renderHeader();renderStatus();
  app.innerHTML=view==='register'?vRegister():view==='profiles'?vProfiles():view==='home'?vHome():view==='learn'?vLearn():view==='lesson'?vLesson():view==='quiz'?vQuiz():view==='placementResult'?vPlacementResult():view==='summary'?vSummary():vProgress();
  if(view==='quiz'){const i=document.getElementById('ans');if(i&&!S.checked){i.focus();const v=i.value;i.value='';i.value=v;}else{const b=document.querySelector('#qform button[type=submit]');b&&b.focus();}}
  if(view==='register'){const n=document.getElementById('nick');n&&!n.value&&n.focus();}
}
function go(v){view=v;confirmReset=false;confirmDel=null;render();try{window.scrollTo(0,0);}catch(e){}}

/* ---------- quiz flow ---------- */
function startPlacement(){const seen=new Set();S={mode:'placement',items:B().plan.map(id=>mk(T[id],seen)),i:0,res:[],checked:false,startXp:state.xp};go('quiz');}
function startPractice(id){
  const items=id==='mixed'?buildMixed(10):(()=>{const seen=new Set();return Array.from({length:8},()=>mk(T[id],seen));})();
  if(state.level==null){state.level=T[id]?T[id].level:B().levels[0];save();}
  S={mode:'practice',topicId:id,level:curLevel(),items,i:0,res:[],checked:false,startXp:state.xp};
  go('quiz');
}
function grade(raw,skipped){
  const q=S.items[S.i];const v=skipped?NaN:parseNum(raw);
  const ok=!skipped&&Math.abs(v-q.ans)<=(q.tol??1e-6);
  S.res[S.i]={raw,ok,skipped};S.draft='';
  if(S.mode==='placement'){next();return;}
  record(q.topic,ok);S.checked=true;save();render();
}
function next(){S.i++;S.checked=false;S.draft='';if(S.i>=S.items.length)finish();else render();}
function finish(){
  const c=S.res.filter(r=>r.ok).length,n=S.items.length;
  const h={d:today(),c,t:n,kind:S.mode==='placement'?'placement':S.topicId,l:S.level??curLevel()};
  state.history=[...state.history,h].slice(-50);
  if(S.mode==='placement'){
    const L=B().levels,by={};L.forEach(l=>by[l]=[0,0]);
    S.items.forEach((q,i)=>{const l=T[q.topic].level;if(!by[l])by[l]=[0,0];by[l][1]++;if(S.res[i].ok)by[l][0]++;});
    let lvl=L[L.length-1],top=true;
    for(const l of L){const [cc,tt]=by[l];if(!tt)continue;if(cc<Math.round(tt*0.7)){lvl=l;top=false;break;}}
    Object.keys(by).forEach(k=>{if(!by[k][1])delete by[k];});
    state.placement={date:today(),score:c,total:n,byLevel:by,level:lvl,top};state.level=lvl;learnLevel=null;
    lastPlacement={items:S.items,res:S.res};save();go('placementResult');return;
  }
  save();go('summary');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.tagName==='A')e.preventDefault();
  const a=b.dataset.act,arg=b.dataset.arg;
  if(a==='go')go(arg);
  else if(a==='lang'){if(view==='quiz'&&S&&!S.checked){const i=document.getElementById('ans');if(i)S.draft=i.value;}
    const keep=view==='register'?{nick:(document.getElementById('nick')||{}).value,age:(document.getElementById('age')||{}).value}:null;
    lang=arg;save();render();
    if(keep){if(keep.nick!=null)document.getElementById('nick').value=keep.nick;if(keep.age!=null){document.getElementById('age').value=keep.age;document.getElementById('agenote').innerHTML=agenoteHtml(keep.age);}}}
  else if(a==='startPlacement')startPlacement();
  else if(a==='setLevel'){state.level=+arg;clampLevel();learnLevel=null;save();go('home');}
  else if(a==='practice')startPractice(arg);
  else if(a==='lesson'){curLesson=arg;if(!state.lessons[arg]){state.lessons[arg]=1;save();}go('lesson');}
  else if(a==='learnLevel'){learnLevel=+arg;render();}
  else if(a==='skip')grade('',true);
  else if(a==='quit'){if(S&&S.mode==='practice'){const done=S.res.filter(Boolean);if(done.length){state.history=[...state.history,{d:today(),kind:S.topicId,l:S.level,partial:true,c:done.filter(r=>r.ok).length,t:done.length}].slice(-50);save();}}S=null;go('home');}
  else if(a==='again')startPractice(S.topicId);
  else if(a==='askReset'){confirmReset=true;render();}
  else if(a==='cancelReset'){confirmReset=false;render();}
  else if(a==='reset'){const p=Object.assign(freshProfile(state.nick,state.age),{id:state.id});store.profiles[p.id]=p;state=p;confirmReset=false;save();go('home');}
  else if(a==='editProfile'){regMode='edit';go('register');}
  else if(a==='addProfile'){regMode='new';go('register');}
  else if(a==='switch'){store.activeId=arg;state=store.profiles[arg];learnLevel=null;save();go('home');}
  else if(a==='del'){confirmDel=arg;render();}
  else if(a==='delNo'){confirmDel=null;render();}
  else if(a==='delYes'){if(arg!==store.activeId){delete store.profiles[arg];}confirmDel=null;save();render();}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='regform'){
    e.preventDefault();
    const nick=document.getElementById('nick').value.trim().slice(0,20),age=parseInt(document.getElementById('age').value,10),msg=document.getElementById('regmsg');
    if(!nick){msg.textContent=t('errNick');return;}
    if(!(age>=6&&age<=99)){msg.textContent=t('errAge');return;}
    if(regMode==='new'){const p=freshProfile(nick,age);store.profiles[p.id]=p;store.activeId=p.id;state=p;}
    else{state.nick=nick;state.age=age;clampLevel();}
    learnLevel=null;save();go(regMode==='edit'?'profiles':'home');return;
  }
  if(e.target.id!=='qform')return;e.preventDefault();
  if(S.checked){next();return;}
  const raw=document.getElementById('ans').value;
  if(!raw.trim()||isNaN(parseNum(raw))){document.getElementById('msg').textContent=raw.trim()?t('msgNum'):t('msgType');return;}
  grade(raw,false);
});
document.addEventListener('input',e=>{if(e.target.id==='age'){const n=document.getElementById('agenote');if(n)n.innerHTML=agenoteHtml(e.target.value);}});
document.addEventListener('change',e=>{if(e.target.id==='lvlsel'){state.level=+e.target.value;learnLevel=null;save();render();}});

render();initRemote();

</script>
<script>
// no pinch or double-tap zoom: the page only scrolls
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault();},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<300&&!e.target.closest('input,select,textarea'))e.preventDefault();lastTap=n;},{passive:false});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
</body>
</html>
